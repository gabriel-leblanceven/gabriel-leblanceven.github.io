{% include base_path %}
<!-- start custom head snippets -->
<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>
<!-- GLE favicon: filled version of the GLE monogram (see _includes/gle-logo.html) -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>
{% if page.noindex %}<meta name="robots" content="noindex, nofollow"/>{% endif %}
<!-- GoatCounter: cookie-free visit statistics, dashboard at https://gleblanc.goatcounter.com -->
<script data-goatcounter="https://gleblanc.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<!-- end custom head snippets -->

<!-- GLE — fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- GLE — hide theme masthead on pages that ship their own nav -->
{% if page.hide_masthead %}
<style>
.masthead { display: none; }
/* Remove theme spacing above the GLE nav and below the GLE footer */
html, body { margin: 0 !important; padding: 0 !important; }
#main { margin-top: 0 !important; margin-bottom: 0 !important; }
.page__inner-wrap > header, .page__meta { display: none !important; }
/* GLE monogram (see _includes/gle-logo.html); nav padding keeps the header height unchanged */
.gle__nav { padding-top: 18px !important; padding-bottom: 18px !important; }
.gle__logo { line-height: 0; }
.gle__mark { display: block; }
.gle__mark-ring { transition: stroke .2s; }
.gle__logo a:hover .gle__mark-ring { stroke: #c8921a; }
</style>
{% endif %}
