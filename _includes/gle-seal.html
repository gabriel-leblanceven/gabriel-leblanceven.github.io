<!-- Round "More in ..." seal for homepage rows: disc with arrow, label set twice along a circular path. Parameters: label (row name), id (unique, for the text path). -->
<span class="gle__seal" aria-hidden="true">
  <svg viewBox="0 0 100 100" width="96" height="96" focusable="false">
    <defs><path id="gle-seal-{{ include.id }}" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0"/></defs>
    <g class="gle__seal-ring"><text font-family="Space Mono, monospace" font-size="8.6" fill="#324f6b"><textPath href="#gle-seal-{{ include.id }}" textLength="238" lengthAdjust="spacing">MORE IN {{ include.label | upcase }} &middot; MORE IN {{ include.label | upcase }} &middot; </textPath></text></g>
    <circle class="gle__seal-disc" cx="50" cy="50" r="22" fill="#324f6b"/>
    <g transform="translate(39.5 39.5) scale(1.5)" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7 H12 M8 3 L12 7 L8 11"/></g>
  </svg>
</span>
